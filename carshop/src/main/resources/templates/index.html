<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Shop - Fetch API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">

<div class="max-w-6xl mx-auto bg-white p-6 rounded-xl shadow-md">

    <h1 class="text-2xl font-normal text-center mb-6">Car Shop</h1>

    <!-- Add/Edit Form Modal -->
    <div id="carFormModal" class="fixed inset-0 bg-black bg-opacity-40 hidden items-center justify-center">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg relative">
            <h2 id="formTitle" class="text-xl font-semibold mb-4">Add New Car</h2>
            <form id="carForm" class="space-y-4">
                <input type="hidden" id="carId" />
                <div>
                    <label class="block mb-1">License Plate</label>
                    <input type="text" id="licensePlateNumber" class="w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block mb-1">Make</label>
                    <input type="text" id="make" class="w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block mb-1">Model</label>
                    <input type="text" id="model" class="w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block mb-1">Year</label>
                    <input type="number" id="year" class="w-full p-2 border rounded-md" required>
                </div>
                <div>
                    <label class="block mb-1">Color</label>
                    <input type="text" id="color" class="w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block mb-1">Body Type</label>
                    <input type="text" id="bodyType" class="w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block mb-1">Engine Type</label>
                    <input type="text" id="engineType" class="w-full p-2 border rounded-md">
                </div>
                <div>
                    <label class="block mb-1">Transmission</label>
                    <input type="text" id="transmission" class="w-full p-2 border rounded-md">
                </div>
                <div class="flex justify-end space-x-2 mt-4">
                    <button type="button" onclick="closeForm()" class="px-4 py-2 bg-gray-400 rounded-md hover:bg-gray-500 text-white">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 rounded-md hover:bg-blue-700 text-white">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Car Button -->
    <div class="flex justify-end mb-4">
        <button onclick="openForm()" class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">+ Add Car</button>
    </div>

    <!-- Car Table -->
    <div class="overflow-x-auto">
        <table class="min-w-full border-collapse table-auto">
            <thead>
                <tr class="bg-gray-200">
                    <th>ID</th>
                    <th>Plate</th>
                    <th>Make</th>
                    <th>Model</th>
                    <th>Year</th>
                    <th>Color</th>
                    <th>Body</th>
                    <th>Engine</th>
                    <th>Transmission</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="car-table-body" class="divide-y divide-gray-200"></tbody>
        </table>
    </div>
</div>

<script>
const tableBody = document.getElementById('car-table-body');
const modal = document.getElementById('carFormModal');
const form = document.getElementById('carForm');
const formTitle = document.getElementById('formTitle');

async function fetchCars() {
    const response = await fetch('/api/cars');
    const cars = await response.json();
    tableBody.innerHTML = '';
    cars.forEach(car => {
        const row = document.createElement('tr');
        row.classList.add('hover:bg-gray-50');
        row.innerHTML = `
            <td class="px-4 py-2">${car.carId}</td>
            <td class="px-4 py-2">${car.licensePlateNumber}</td>
            <td class="px-4 py-2">${car.make}</td>
            <td class="px-4 py-2">${car.model}</td>
            <td class="px-4 py-2">${car.year}</td>
            <td class="px-4 py-2">${car.color || ''}</td>
            <td class="px-4 py-2">${car.bodyType || ''}</td>
            <td class="px-4 py-2">${car.engineType || ''}</td>
            <td class="px-4 py-2">${car.transmission || ''}</td>
            <td class="px-4 py-2 space-x-2">
                <button onclick="editCar(${car.carId})" class="px-2 py-1 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">Edit</button>
                <button onclick="deleteCar(${car.carId})" class="px-2 py-1 bg-red-600 text-white rounded-md hover:bg-red-700 text-sm">Delete</button>
            </td>
        `;
        tableBody.appendChild(row);
    });
}

async function deleteCar(id) {
    if(confirm('Are you sure you want to delete this car?')) {
        await fetch(`/api/cars/${id}`, { method: 'DELETE' });
        fetchCars();
    }
}

function openForm(car = null) {
    modal.classList.remove('hidden');
    if(car) {
        formTitle.textContent = 'Edit Car';
        document.getElementById('carId').value = car.carId;
        document.getElementById('licensePlateNumber').value = car.licensePlateNumber;
        document.getElementById('make').value = car.make;
        document.getElementById('model').value = car.model;
        document.getElementById('year').value = car.year;
        document.getElementById('color').value = car.color || '';
        document.getElementById('bodyType').value = car.bodyType || '';
        document.getElementById('engineType').value = car.engineType || '';
        document.getElementById('transmission').value = car.transmission || '';
    } else {
        formTitle.textContent = 'Add New Car';
        form.reset();
        document.getElementById('carId').value = '';
    }
}

function closeForm() {
    modal.classList.add('hidden');
}

async function editCar(id) {
    const response = await fetch(`/api/cars/${id}`);
    const car = await response.json();
    openForm(car);
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const carId = document.getElementById('carId').value;
    const carData = {
        licensePlateNumber: document.getElementById('licensePlateNumber').value,
        make: document.getElementById('make').value,
        model: document.getElementById('model').value,
        year: parseInt(document.getElementById('year').value),
        color: document.getElementById('color').value,
        bodyType: document.getElementById('bodyType').value,
        engineType: document.getElementById('engineType').value,
        transmission: document.getElementById('transmission').value
    };

    if(carId) {
        await fetch(`/api/cars/${carId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(carData)
        });
    } else {
        await fetch('/api/cars', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(carData)
        });
    }

    closeForm();
    fetchCars();
});

fetchCars();
</script>

</body>
</html>
