<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3c4043;
        }
        .container {
            text-align: center;
            max-width: 400px;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 96px;
            margin: 0 0 8px;
            color: #202124;
            font-weight: 700;
        }
        h2 {
            margin: 0 0 24px;
            font-weight: normal;
            font-size: 22px;
            color: #5f6368;
        }
        p {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 30px;
        }
        a.button {
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        a.button:hover {
            background-color: #155ab6;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The requested URL was not found on this server.</p>
    <a href="/" class="button">Back to Home</a>
</div>
</body>
</html>
